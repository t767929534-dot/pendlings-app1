<!DOCTYPE html>
<html lang="sv">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="google-site-verification" content="8jaeZC80v4yv1_dsSLOFhIzimUA2MLyQEDNlEBIHLf0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyllenstorms pendlingskalkylator - Tid Avstånd och Driftkostnad</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #d4af37;
            --text-color: #333333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 8px;
            --block-bg: #fafbfc;
            --border-color: #e1e8ed;
            --ikon-bg: #edf2f7;
        }

        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #e0e0e0;
            --text-color: #f5f5f5;
            --text-light: #a0a0a0;
            --block-bg: #262626;
            --border-color: #333333;
            --ikon-bg: #2d2d2d;
            --shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 5px solid var(--accent-color);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .historik-box {
            margin-bottom: 25px;
            padding: 15px;
            background: var(--block-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }

        .historik-box h3 {
            font-size: 0.9rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .historik-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .historik-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            text-decoration: none;
            font-weight: 500;
        }

        .historik-item.pos-0 { background-color: #2c3e50; border-left: 5px solid var(--accent-color); }
        .historik-item.pos-1 { background-color: #4a6572; }
        .historik-item.pos-2 { background-color: #708090; }

        .sök-container {
            margin-bottom: 25px;
            position: relative;
        }

        .sök-fält {
            width: 100%;
            padding: 12px 15px 12px 40px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: var(--radius);
            outline: none;
        }

        .sök-ikon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .rutt-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .rutt-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .rutt-kort {
            display: flex;
            align-items: center;
            background: var(--block-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 15px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.2s ease-in-out;
        }

        .rutt-kort:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .rutt-kort.hidden { display: none !important; }

        .ikon-box {
            font-size: 1.5rem;
            margin-right: 15px;
            background: var(--ikon-bg);
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
        }

        .rutt-info { flex-grow: 1; }
        .rutt-titel { font-weight: 600; color: var(--primary-color); }
        .rutt-detalj { font-size: 0.85rem; color: var(--text-light); }

        .laddar, .inga-resultat {
            text-align: center;
            color: var(--text-light);
            padding: 20px;
            grid-column: 1 / -1;
        }

        .hidden { display: none; }

        .darkmode-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary-color);
            color: var(--card-bg);
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <button id="darkmode-toggle" class="darkmode-btn" title="Växla nattläge">🌓</button>

    <div class="container">
        <header>
            <h1>🚗 Gyllenstorms Pendlingskalkylator</h1>
            <p class="subtitle">Min rutt för beräkning av tid, avstånd, driftmedel, skattereduktion och trafiksäkerhetsanalys.</p>
        </header>

        <div id="historik-sektion" class="historik-box" style="display: none;">
            <h3>🕒 Senaste aktivitet</h3>
            <div id="historik-lista" class="historik-lista"></div>
        </div>

        <div class="sök-container">
            <span class="sök-ikon">🔍</span>
            <input type="text" id="sök-input" class="sök-fält" placeholder="Sök på stad eller ort...">
        </div>

        <div id="rutt-lista" class="rutt-grid">
            <div class="laddar">Laddar rutter...</div>
        </div>
        
        <div id="tom-sökning" class="inga-resultat hidden">Inga rutter matchar sökningen.</div>
    </div>

    <script>
        // 1. Initiera mörkt läge
        if (localStorage.getItem('mörkt_tema') === 'true') {
            document.body.classList.add('dark-theme');
        }

        document.getElementById('darkmode-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('mörkt_tema', document.body.classList.contains('dark-theme'));
        });

        // 2. Ladda rutter och hantera URL-parametrar
        fetch('rutter.csv')
            .then(response => response.text())
            .then(data => {
                // Filtrerar bort eventuella helt tomma rader i slutet av CSV-filen
                let rader = data.split(/\r?\n/).slice(1).filter(rad => rad.trim() !== '');
                let gridHtml = '';
                
                rader.forEach(rad => {
                    let kolumner = rad.split(',');
                    if(kolumner.length >= 2) {
                        let start = kolumner[0].trim();
                        let mal = kolumner[1].trim();
                        if(!start || !mal) return;

                        let urlVänlig = `rutt.html?fran=${encodeURIComponent(start)}&till=${encodeURIComponent(mal)}`;
                        
                        gridHtml += `
                            <a href="${urlVänlig}" class="rutt-kort" data-search="${start.toLowerCase()} ${mal.toLowerCase()}" data-start="${start}" data-mal="${mal}">
                                <div class="ikon-box">📍</div>
                                <div class="rutt-info">
                                    <div class="rutt-titel">${start} ➔ ${mal}</div>
                                    <div class="rutt-detalj">🚗 Pendla med bil</div>
                                </div>
                            </a>
                        `;
                    }
                });
                
                document.getElementById('rutt-lista').innerHTML = gridHtml || '<div class="laddar">Inga rutter hittades.</div>';
                
                // --- PARAMETER-LOGIK ---
                const params = new URLSearchParams(window.location.search);
                const fran = params.get('fran');
                const till = params.get('till');

                if (fran && till) {
                    const sökInput = document.getElementById('sök-input');
                    const tomMeddelande = document.getElementById('tom-sökning');
                    const kort = document.querySelectorAll('.rutt-kort');
                    
                    const sökSträng1 = fran.toLowerCase();
                    const sökSträng2 = till.toLowerCase();
                    if (sökInput) sökInput.value = fran + " " + till;

                    let synligaKort = 0;
                    kort.forEach(r => {
                        const sökText = r.getAttribute('data-search') || '';
                        // Kollar om både start och mål matchas oberoende av ordning
                        if (sökText.includes(sökSträng1) && sökText.includes(sökSträng2)) {
                            r.classList.remove('hidden');
                            synligaKort++;
                        } else {
                            r.classList.add('hidden');
                        }
                    });

                    if (synligaKort === 0) {
                        tomMeddelande.classList.remove('hidden');
                    } else {
                        tomMeddelande.classList.add('hidden');
                    }

                    document.title = "Pendling " + fran + " till " + till;
                }

                initieraSökfunktion();
                initieraKlickHistorik();
                uppdateraHistorikVy();
            })
            .catch(err => {
                document.getElementById('rutt-lista').innerHTML = '<div class="laddar">Kunde inte ladda rutter. Se till att rutter.csv finns.</div>';
            });

        // 3. Hjälpfunktioner
        function sparaTillHistorik(typ, text, url = '#') {
            let historik = JSON.parse(localStorage.getItem('pendel_historik')) || [];
            const nu = new Date();
            const tidsstämpel = `${nu.toLocaleDateString('sv-SE')} kl. ${nu.toLocaleTimeString('sv-SE', {hour: '2-digit', minute:'2-digit'})}`;
            
            const nyHändelse = { typ, text, url, tid: tidsstämpel, id: Date.now() };
            historik = historik.filter(h => !(h.text === text && h.typ === typ));
            historik.unshift(nyHändelse);
            historik = historik.slice(0, 3);
            
            localStorage.setItem('pendel_historik', JSON.stringify(historik));
            uppdateraHistorikVy();
        }

        function uppdateraHistorikVy() {
            const historik = JSON.parse(localStorage.getItem('pendel_historik')) || [];
            const box = document.getElementById('historik-sektion');
            const lista = document.getElementById('historik-lista');
            
            if (historik.length === 0) {
                box.style.display = 'none';
                return;
            }
            
            box.style.display = 'block';
            lista.innerHTML = '';
            
            historik.forEach((h, index) => {
                const ikon = h.typ === 'sökning' ? '🔍' : '🛣️';
                const prefix = h.typ === 'sökning' ? 'Sökte efter: ' : 'Klickade: ';
                const item = document.createElement('a');
                item.href = h.url;
                item.className = `historik-item pos-${index}`;
                
                if(h.url === '#') {
                    item.addEventListener('click', (e) => {
                        e.preventDefault();
                        const sökFält = document.getElementById('sök-input');
                        sökFält.value = h.text;
                        sökFält.dispatchEvent(new Event('input'));
                    });
                }

                item.innerHTML = `
                    <span>${ikon} <strong>${prefix}</strong> "${h.text}"</span>
                    <span class="historik-tid">${h.tid}</span>
                `;
                lista.appendChild(item);
            });
        }

        function initieraSökfunktion() {
            const sökInput = document.getElementById('sök-input');
            const tomMeddelande = document.getElementById('tom-sökning');
            let sökTimeout;

            sökInput.addEventListener('input', function() {
                const sökOrd = this.value.toLowerCase().trim();
                const kort = document.querySelectorAll('.rutt-kort');
                let synligaKort = 0;

                // Splittar sökningen på mellanslag så att man kan söka på t.ex. "Sthlm Gbg"
                const sökOrdArray = sökOrd.split(/\s+/);

                kort.forEach(r => {
                    const sökText = r.getAttribute('data-search') || '';
                    // Kontrollerar att ALLA sökord finns med i ruttens data-search
                    const matcharAllt = sökOrdArray.every(ord => sökText.includes(ord));

                    if (matcharAllt) {
                        r.classList.remove('hidden');
                        synligaKort++;
                    } else {
                        r.classList.add('hidden');
                    }
                });

                if (synligaKort === 0 && sökOrd !== '') {
                    tomMeddelande.classList.remove('hidden');
                } else {
                    tomMeddelande.classList.add('hidden');
                }

                clearTimeout(sökTimeout);
                if (sökOrd.length >= 2) {
                    sökTimeout = setTimeout(() => {
                        sparaTillHistorik('sökning', sökInput.value.trim());
                    }, 1500); // Ökat till 1.5s så historiken inte sparas mitt i att man skriver kvickt
                }
            });
        }

        function initieraKlickHistorik() {
            const kort = document.querySelectorAll('.rutt-kort');
            kort.forEach(k => {
                k.addEventListener('click', function() {
                    const start = this.getAttribute('data-start');
                    const mal = this.getAttribute('data-mal');
                    const url = this.getAttribute('href');
                    sparaTillHistorik('rutt', `${start} till ${mal}`, url);
                });
            });
        }
    </script>
</body>
</html>
