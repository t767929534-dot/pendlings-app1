<!DOCTYPE html>
<html lang="sv">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="google-site-verification" content="8jaeZC80v4yv1_dsSLOFhIzimUA2MLyQEDNlEBIHLf0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyllenstormś pendlingskalkylator - Tid Avstånd och Driftkostnad</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #d4af37;
            --text-color: #333333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 8px;
            --block-bg: #fafbfc;
            --border-color: #e1e8ed;
            --ikon-bg: #edf2f7;
        }

        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #e0e0e0;
            --text-color: #f5f5f5;
            --text-light: #a0a0a0;
            --block-bg: #262626;
            --border-color: #333333;
            --ikon-bg: #2d2d2d;
            --shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 5px solid var(--accent-color);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .historik-box {
            margin-bottom: 25px;
            padding: 15px;
            background: var(--block-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }

        .historik-box h3 {
            font-size: 0.9rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .historik-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .historik-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            text-decoration: none;
            font-weight: 500;
        }

        .historik-item.pos-0 { background-color: #2c3e50; border-left: 5px solid var(--accent-color); }
        .historik-item.pos-1 { background-color: #4a6572; }
        .historik-item.pos-2 { background-color: #708090; }

        .sök-container {
            margin-bottom: 25px;
            position: relative;
        }

        .sök-fält {
            width: 100%;
            padding: 12px 15px 12px 40px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: var(--radius);
            outline: none;
        }

        .sök-ikon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .rutt-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .rutt-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .rutt-kort {
            display: flex;
            align-items: center;
            background: var(--block-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 15px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.2s ease-in-out;
        }

        .ikon-box {
            font-size: 1.5rem;
            margin-right: 15px;
            background: var(--ikon-bg);
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
        }

        .rutt-info { flex-grow: 1; }
        .rutt-titel { font-weight: 600; color: var(--primary-color); }
        .rutt-detalj { font-size: 0.85rem; color: var(--text-light); }

        .laddar, .inga-resultat {
            text-align: center;
            color: var(--text-light);
            padding: 20px;
            grid-column: 1 / -1;
        }

        .hidden { display: none !important; }

        /* Stil för paginering */
        .paginering {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .paginering-btn {
            background: var(--block-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .paginering-btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: #000;
        }

        .paginering-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .paginering-info {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .darkmode-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary-color);
            color: var(--card-bg);
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <button id="darkmode-toggle" class="darkmode-btn" title="Växla nattläge">🌓</button>

    <div class="container">
        <header>
            <h1>🚗 Gyllenstormś Pendlingskalkylator</h1>
            <p class="subtitle">Min rutt för beräkning av tid, avstånd, driftmedel, skattereduktion och trafiksäkerhetsanalys.</p>
        </header>

        <div id="historik-sektion" class="historik-box" style="display: none;">
            <h3>🕒 Senaste aktivitet</h3>
            <div id="historik-lista" class="historik-lista"></div>
        </div>

        <div class="sök-container">
            <span class="sök-ikon">🔍</span>
            <input type="text" id="sök-input" class="sök-fält" placeholder="Sök på stad eller ort...">
        </div>

        <div id="rutt-lista" class="rutt-grid">
            <div class="laddar">Laddar Karl-Johan Gyllenstormś rutter...</div>
        </div>
        
        <div id="tom-sökning" class="inga-resultat hidden">Inga rutter matchar sökningen.</div>

        <div id="paginering-container" class="paginering hidden"></div>
    </div>

    <script>
        // Globala variabler för att hantera data och paginering
        let allaRutter = [];
        let filtreradeRutter = [];
        let nuvarandeSida = 1;
        const raderPerSida = 20; // Ändra här om du vill visa fler eller färre rutter per sida

        // 1. Initiera mörkt läge
        if (localStorage.getItem('mörkt_tema') === 'true') {
            document.body.classList.add('dark-theme');
        }

        document.getElementById('darkmode-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('mörkt_tema', document.body.classList.contains('dark-theme'));
        });

        // 2. Ladda rutter och hantera URL-parametrar
        const ruttListaElement = document.getElementById('rutt-lista');

        fetch('rutter.csv')
            .then(response => {
                // Kolla om servern faktiskt hittar filen
                if (!response.ok) {
                    throw new Error(`Servern svarade med status ${response.status} (${response.statusText}). Kontrollera att filnamnet rutter.csv stämmer exakt med stora/små bokstäver på GitHub.`);
                }
                return response.text();
            })
            .then(data => {
                // Delar upp raderna och rensar tomma rader
                let rader = data.split(/\r?\n/).filter(line => line.trim() !== "");
                
                // Hoppa över rubrikraden (start,mal) om den finns
                if (rader.length > 0) rader = rader.slice(1);
                
                // Strukturera upp all data i arrayen
                rader.forEach((rad, index) => {
                    // Om din fil använder semikolon, ändra ',' till ';' här under
                    let kolumner = rad.split(',');
                    if(kolumner.length >= 2) {
                        let start = kolumner[0].trim();
                        let mal = kolumner[1].trim();
                        if(!start || !mal) return;

                        allaRutter.push({
                            start: start,
                            mal: mal,
                            searchString: `${start.toLowerCase()} ${mal.toLowerCase()}`,
                            url: `rutt.html?fran=${encodeURIComponent(start)}&till=${encodeURIComponent(mal)}`
                        });
                    }
                });

                // Kontrollera om vi lyckades läsa några rader överhuvudtaget
                if (allaRutter.length === 0) {
                    throw new Error("CSV-filen laddades, men koden kunde inte tolka några rader. Kontrollera att filen är kommaseparerad (inte semikolon).");
                }

                // Sätt filtrerade rutter till alla rutter som standard vid start
                filtreradeRutter = [...allaRutter];
                
                // Kolla efter URL-parametrar
                const params = new URLSearchParams(window.location.search);
                const fran = params.get('fran');
                const till = params.get('till');

                if (fran && till) {
                    const sökInput = document.getElementById('sök-input');
                    const sökSträng = (fran + " " + till).toLowerCase();
                    if (sökInput) sökInput.value = fran + " " + till;
                    
                    filtreradeRutter = allaRutter.filter(r => r.searchString.includes(sökSträng));
                    document.title = "Pendling " + fran + " till " + till;
                }

                // Rendera gränssnittet
                visaSida(1);
                initieraSökfunktion();
                uppdateraHistorikVy();
            })
            .catch(err => {
                // Visar felmeddelandet tydligt på skärmen om något kraschar
                ruttListaElement.innerHTML = `
                    <div class="laddar" style="color: #e74c3c; font-weight: bold;">
                        ⚠️ Ett fel uppstod:<br>
                        <span style="font-family: monospace; font-size: 0.9rem; color: var(--text-color); display: inline-block; margin-top: 10px; text-align: left;">
                            ${err.message}
                        </span>
                    </div>`;
            });

        // Funktion för att rendera en specifik sida av rutter
        function visaSida(sida) {
            nuvarandeSida = sida;
            const ruttLista = document.getElementById('rutt-lista');
            const tomMeddelande = document.getElementById('tom-sökning');
            
            if (filtreradeRutter.length === 0) {
                ruttLista.innerHTML = '';
                tomMeddelande.classList.remove('hidden');
                byggPagineringsKnappar(0);
                return;
            }

            tomMeddelande.classList.add('hidden');
            
            const startIndex = (sida - 1) * raderPerSida;
            const slutIndex = Math.min(startIndex + raderPerSida, filtreradeRutter.length);
            const rutterAttVisa = filtreradeRutter.slice(startIndex, slutIndex);

            let gridHtml = '';
            rutterAttVisa.forEach(r => {
                gridHtml += `
                    <a href="${r.url}" class="rutt-kort" data-start="${r.start}" data-mal="${r.mal}">
                        <div class="ikon-box">📍</div>
                        <div class="rutt-info">
                            <div class="rutt-titel">${r.start} ➔ ${r.mal}</div>
                            <div class="rutt-detalj">🚗 Pendla med bil</div>
                        </div>
                    </a>
                `;
            });

            ruttLista.innerHTML = gridHtml;
            initieraKlickHistorik();
            
            const totalaSidor = Math.ceil(filtreradeRutter.length / raderPerSida);
            byggPagineringsKnappar(totalaSidor);
        }

        // Funktion för att generera pagineringsknapparna dynamiskt
        function byggPagineringsKnappar(totalaSidor) {
            const container = document.getElementById('paginering-container');
            if (totalaSidor <= 1) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            container.innerHTML = `
                <button class="paginering-btn" id="prev-page" ${nuvarandeSida === 1 ? 'disabled' : ''}>Föregående</button>
                <span class="paginering-info">Sida ${nuvarandeSida} av ${totalaSidor} (Totalt ${filtreradeRutter.length} rutter)</span>
                <button class="paginering-btn" id="next-page" ${nuvarandeSida === totalaSidor ? 'disabled' : ''}>Nästa</button>
            `;

            document.getElementById('prev-page').addEventListener('click', () => {
                if (nuvarandeSida > 1) {
                    visaSida(nuvarandeSida - 1);
                    window.scrollTo({top: 0, behavior: 'smooth'});
                }
            });

            document.getElementById('next-page').addEventListener('click', () => {
                if (nuvarandeSida < totalaSidor) {
                    visaSida(nuvarandeSida + 1);
                    window.scrollTo({top: 0, behavior: 'smooth'});
                }
            });
        }

        // Spara historik i Local
