<!DOCTYPE html>
<html lang="sv">
<head>
<meta name="google-site-verification" content="8jaeZC80v4yv1_dsSLOFhIzimUA2MLyQEDNlEBIHLf0" />
    <meta charset="UTF-8">
    <title>Pendlingskalkylatorn - Tid och Avstånd</title>
</head>
<body>
    <h1>Välj din pendlingsrutt</h1>
    <div id="rutt-lista">Laddar rutter...</div>

    <script>
        // Den här koden läser din CSV-fil och skapar länkar automatiskt
        fetch('rutter.csv')
            .then(response => response.text())
            .then(data => {
                let rader = data.split('\n').slice(1); // Skippa rubrikraden
                let listaHtml = '<ul>';
                
                rader.forEach(rad => {
                    let kolumner = rad.split(',');
                    if(kolumner.length >= 2) {
                        let start = kolumner[0].trim();
                        let mal = kolumner[1].trim();
                        let urlVänlig = `rutt.html?fran=${encodeURIComponent(start)}&till=${encodeURIComponent(mal)}`;
                        listaHtml += `<li><a href="${urlVänlig}">Pendla från ${start} till ${mal}</a></li>`;
                    }
                });
                
                listaHtml += '</ul>';
                document.getElementById('rutt-lista').innerHTML = listaHtml;
            });
    </script>
</body>
</html>
