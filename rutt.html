<script>
    const urlParams = new URLSearchParams(window.location.search);
    const fran = urlParams.get('fran');
    const till = urlParams.get('till');

    const KR_PER_KM = 1.304; 

    if (localStorage.getItem('mörkt_tema') === 'true') {
        document.body.classList.add('dark-theme');
    }
    document.getElementById('darkmode-btn').addEventListener('click', () => {
        document.body.classList.toggle('dark-theme');
        localStorage.setItem('mörkt_tema', document.body.classList.contains('dark-theme'));
    });

    if (fran && till) {
        document.getElementById('sidtitel').innerText = `Pendla från ${fran} till ${till}`;
        document.getElementById('rubrik').innerText = `📍 ${fran} ➔ ${till}`;
        
        const delaBtn = document.getElementById('dela-btn');
        delaBtn.style.display = 'flex';
        delaBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href)
                .then(() => {
                    delaBtn.innerText = '✅ Länk kopierad!';
                    setTimeout(() => delaBtn.innerHTML = '🔗 Dela rutt', 2000);
                });
        });

        fetch('rutter.csv')
            .then(response => response.text())
            .then(data => {
                let rader = data.split(/\r?\n/);
                let ruttHittad = false;

                for (let i = 1; i < rader.length; i++) {
                    let kolumner = rader[i].split(',');
                    if (kolumner.length >= 5) {
                        let csvFran = kolumner[0].trim();
                        let csvTill = kolumner[1].trim();
                        let distans = kolumner[2].trim();
                        let tid = kolumner[3].trim();
                        let genereradText = kolumner[4].replace(/"/g, '').trim();

                        if (csvFran.toLowerCase() === fran.toLowerCase() && csvTill.toLowerCase() === till.toLowerCase()) {
                            
                            const numeriskDistans = parseFloat(distans.replace(/[^\d.]/g, ''));
                            const numeriskTid = parseInt(tid);

                            // --- BERÄKNINGAR ---
                            let kostnadText = "-";
                            let manadsKostnad = "-";
                            let arsKostnad = "-";
                            let timmarPerManad = "-";

                            if (!isNaN(numeriskDistans)) {
                                kostnadText = Math.round(numeriskDistans * KR_PER_KM) + " kr";
                                // Tur och retur (2) * 22 dagar
                                let mKostnadNum = (numeriskDistans * KR_PER_KM) * 2 * 22;
                                manadsKostnad = Math.round(mKostnadNum).toLocaleString('sv-SE');
                                // Årskostnad (10 månader)
                                arsKostnad = Math.round(mKostnadNum * 10).toLocaleString('sv-SE');
                                
                                if (!isNaN(numeriskTid)) {
                                    timmarPerManad = Math.round((numeriskTid * 2 * 22) / 60);
                                }
                            }

                            // --- HTML RENDERING ---
                            document.getElementById('innehall').innerHTML = `
                                <div class="kalkyl-grid">
                                    <div class="kalkyl-kort tid">
                                        <span class="etikett">⏱️ Körtid</span>
                                        <span class="siffra">${tid} min</span>
                                    </div>
                                    <div class="kalkyl-kort distans">
                                        <span class="etikett">📏 Distans</span>
                                        <span class="siffra">${distans} km</span>
                                    </div>
                                    <div class="kalkyl-kort kostnad">
                                        <span class="etikett">⛽ Bränsle</span>
                                        <span class="siffra">${kostnadText}</span>
                                    </div>
                                </div>

                                <div class="text-block">
                                    <p>📝 ${genereradText}</p>
                                    <small class="beräknings-notis">* Kostnaden avser uppskattad bränslekostnad.</small>
                                </div>

                                <div class="text-block" style="border-left: 5px solid #1abc9c;">
                                    <p>📊 <strong>Månadskostnad:</strong> <span style="font-weight: bold; color: #1abc9c; font-size:1.15rem;">${manadsKostnad} kr</span></p>
                                    <p style="font-size: 0.85rem; margin-top: 5px;">
                                        📅 <strong>Årskalkyl (10 mån):</strong> ${arsKostnad} kr<br>
                                        ⏳ <strong>Tid i bil:</strong> ca ${timmarPerManad} timmar/månad
                                    </p>
                                </div>

                                <div class="text-block" style="border-left: 5px solid var(--accent-color);">
                                    <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 5px;">
                                        <label style="font-weight: bold;">⏱️ När måste du vara framme?</label>
                                        <input type="time" id="ankomst-tid" class="ankomst-input-fält" value="08:00">
                                    </div>
                                    <p style="margin-top: 12px;">
                                        🚗 Du bör rulla hemifrån senast: <strong id="starta-senast" style="color: #e74c3c; font-size: 1.15rem;">-</strong>
                                    </p>
                                </div>

                                <form action="https://www.google.com/maps/dir/" method="GET" target="_blank">
                                    <input type="hidden" name="api" value="1">
                                    <input type="hidden" name="origin" value="${csvFran}">
                                    <input type="hidden" name="destination" value="${csvTill}">
                                    <input type="hidden" name="travelmode" value="driving">
                                    <button type="submit" class="maps-knapp">🗺️ Starta GPS i Google Maps</button>
                                </form>
                            `;
                            
                            initieraAnkomstVäljare(numeriskTid);
                            ruttHittad = true;
                            break;
                        }
                    }
                }

                if (!ruttHittad) {
                    document.getElementById('innehall').innerHTML = '<div class="felmeddelande">❌ Hittade inte rutten.</div>';
                }
            });
    }

    function initieraAnkomstVäljare(körtidMinuter) {
        const tidsFält = document.getElementById('ankomst-tid');
        if(!tidsFält) return;
        
        function beräknaAvgång() {
            const [timmar, minuter] = tidsFält.value.split(':').map(Number);
            let totalaMinuter = timmar * 60 + minuter - körtidMinuter;
            if (totalaMinuter < 0) totalaMinuter += 1440;
            
            const avgångsTimme = String(Math.floor(totalaMinuter / 60)).padStart(2, '0');
            const avgångsMinut = String(totalaMinuter % 60).padStart(2, '0');
            document.getElementById('starta-senast').textContent = `kl. ${avgångsTimme}:${avgångsMinut}`;
        }
        tidsFält.addEventListener('input', beräknaAvgång);
        beräknaAvgång();
    }
</script>
