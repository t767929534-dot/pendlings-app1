<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gyllenstormś beräknade pendlingstid, avstånd och bränslekostnad för rutt med bil.">
    <meta name="robots" content="index, follow">
    <title id="sidtitel">Pendla - Tid och Avstånd</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #d4af37;
            --text-color: #333333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 8px;
            --success-color: #1abc9c;
            --warning-color: #e67e22;
        }

        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #ecf0f1;
            --text-color: #e0e0e0;
            --text-light: #a0a0a0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 5px solid var(--accent-color);
        }

        .nav-rad {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .tillbaka-länk {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .dela-knapp {
            background: none;
            border: 1px solid #e1e8ed;
            padding: 6px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        body.dark-theme header { border-bottom-color: #333; }

        .kalkyl-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (min-width: 480px) {
            .kalkyl-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .kalkyl-kort {
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            color: white;
        }

        .kalkyl-kort.tid { background-color: #2c3e50; border-left: 5px solid var(--accent-color); }
        .kalkyl-kort.distans { background-color: #4a6572; }
        .kalkyl-kort.kostnad { background-color: var(--success-color); }

        .kalkyl-kort .etikett { display: block; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 5px; }
        .kalkyl-kort .siffra { font-size: 1.6rem; font-weight: bold; }

        .text-block {
            background: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        body.dark-theme .text-block { background: #252525; border-color: #383838; }

        .rad-ekonomi { display: flex; justify-content: space-between; margin-bottom: 5px; }
        
        .beräknings-notis {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 15px;
            border-top: 1px solid #e1e8ed;
            padding-top: 10px;
            display: block;
        }

        .input-fält {
            padding: 6px 10px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text-color);
            margin-left: 5px;
        }

        .maps-knapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #2c3e50;
            color: white;
            padding: 14px;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 1rem;
        }

        .darkmode-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            width: 45px;
            height: 45px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-rad">
            <a href="index.html" class="tillbaka-länk">⬅️ Tillbaka</a>
            <button id="dela-btn" class="dela-knapp">🔗 Dela rutt</button>
        </div>
        
        <header>
            <h1 id="rubrik">Laddar ruttinformation...</h1>
        </header>
        
        <div id="innehall">
            <div class="laddar">Söker efter data...</div>
        </div>
    </div>

    <button id="darkmode-btn" class="darkmode-btn">🌓</button>

    <script>
        // --- KONFIGURATION & ORIGINALDATA ---
        const KR_PER_KM = 1.304; 
        const ARBETSDAGAR_PER_AR = 225;
        const AVDRAG_PER_KM = 2.5; 
        const SJÄLVRISK = 11000; 
        const SKATT_EFFEKT = 0.30; 
        const RISK_INCIDENT = 0.00004; 
        const RISK_PERSONSKADA = 0.000003;
        const CO2_PER_KM = 120; // gram

        const urlParams = new URLSearchParams(window.location.search);
        const fran = urlParams.get('fran');
        const till = urlParams.get('till');

        // Dark mode
        if (localStorage.getItem('mörkt_tema') === 'true') document.body.classList.add('dark-theme');
        document.getElementById('darkmode-btn').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('mörkt_tema', document.body.classList.contains('dark-theme'));
        });

        // Dela-funktion
        document.getElementById('dela-btn').addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({ title: document.title, url: window.location.href });
            } else {
                alert("Länken är: " + window.location.href);
            }
        });

        if (fran && till) {
            document.getElementById('sidtitel').innerText = `${fran} ➔ ${till} | Pendlingstid | Gyllenstorm`;
            document.getElementById('rubrik').innerText = `📍 ${fran} ➔ ${till}`;

            fetch('rutter.csv')
                .then(res => res.text())
                .then(data => {
                    const rader = data.split(/\r?\n/);
                    let hittad = false;

                    for (let i = 1; i < rader.length; i++) {
                        const cols = rader[i].split(',');
                        if (cols.length >= 5 && cols[0].trim().toLowerCase() === fran.toLowerCase()) {
                            renderSida(cols);
                            hittad = true;
                            break;
                        }
                    }
                    if(!hittad) document.getElementById('innehall').innerHTML = "Rutten kunde inte hittas.";
                });
        }

        function renderSida(cols) {
            const csvFran = cols[0].trim();
            const csvTill = cols[1].trim();
            const km = parseFloat(cols[2].replace(/[^\d.]/g, ''));
            const tid = cols[3].trim();
            const genereradText = cols[4].replace(/"/g, '').trim();

            // Beräkningar (Dina original-formler)
            const mil = km / 10;
            const dagligDistansKm = km * 2;
            const dagligDistansMil = mil * 2;
            const kostnadEnkel = km * KR_PER_KM;
            const manadsKostnad = Math.round(kostnadEnkel * 2 * 22);
            const arsKostnadBrutto = Math.round(kostnadEnkel * 2 * ARBETSDAGAR_PER_AR);
            
            const totaltAvdragsUnderlag = Math.round(dagligDistansKm * ARBETSDAGAR_PER_AR * AVDRAG_PER_KM);
            let skatteLättnad = totaltAvdragsUnderlag > SJÄLVRISK ? Math.round((totaltAvdragsUnderlag - SJÄLVRISK) * SKATT_EFFEKT) : 0;
            const nettoArsKostnad = arsKostnadBrutto - skatteLättnad;

            const distansManadMil = dagligDistansMil * 22;
            const distansArMil = dagligDistansMil * ARBETSDAGAR_PER_AR;
            const riskIncidentManad = (1 - Math.pow(1 - RISK_INCIDENT, distansManadMil)) * 100;
            const riskIncidentAr = (1 - Math.pow(1 - RISK_INCIDENT, distansArMil)) * 100;
            const riskSkadaManad = (1 - Math.pow(1 - RISK_PERSONSKADA, distansManadMil)) * 100;
            const riskSkadaAr = (1 - Math.pow(1 - RISK_PERSONSKADA, distansArMil)) * 100;
            
            const co2Ar = Math.round((dagligDistansKm * ARBETSDAGAR_PER_AR * CO2_PER_KM) / 1000);

            document.getElementById('innehall').innerHTML = `
                <div class="kalkyl-grid">
                    <div class="kalkyl-kort tid">
                        <span class="etikett">⏱️ Körtid</span>
                        <span class="siffra">${tid} min</span>
                    </div>
                    <div class="kalkyl-kort distans">
                        <span class="etikett">📏 Distans</span>
                        <span class="siffra">${km} km</span>
                    </div>
                    <div class="kalkyl-kort kostnad">
                        <span class="etikett">⛽ Bränsle</span>
                        <span class="siffra">${Math.round(kostnadEnkel)} kr</span>
                    </div>
                </div>

                <div class="text-block">
                    <p>📝 ${genereradText}</p>
                    <p style="margin-top:10px; font-size:0.85rem; color:var(--success-color)">🌱 Beräknat CO2-utsläpp: ~${co2Ar} kg/år</p>
                </div>

                <div class="text-block" style="border-left: 5px solid var(--success-color);">
                    <p style="margin-bottom: 10px;">📊 <strong>Gyllenstormś Ekonomiska Kalkyl (Bil)</strong></p>
                    <div class="rad-ekonomi"><span>Månadskostnad (ca 22 dgr):</span> <strong>${manadsKostnad.toLocaleString('sv-SE')} kr</strong></div>
                    <div class="rad-ekonomi"><span>Årskostnad (Bränsle):</span> <strong>${arsKostnadBrutto.toLocaleString('sv-SE')} kr</strong></div>
                    <hr style="margin: 10px 0; border: 0; border-top: 1px solid #eee;">
                    <div class="rad-ekonomi" style="color: #27ae60;"><span>Uppskattad skattereduktion:</span> <strong>- ${skatteLättnad.toLocaleString('sv-SE')} kr/år</strong></div>
                    <div class="rad-ekonomi" style="font-weight: bold; margin-top: 5px;"><span>Netto årskostnad (efter skatt):</span> <span>${nettoArsKostnad.toLocaleString('sv-SE')} kr</span></div>
                    
                    <small class="beräknings-notis">* Baseras på 25 kr/mil i avdrag, 30% marginalskatt och 11 000 kr i självrisk. Copyright 2026 - Karl-Johan Gyllenstorm.</small>
                </div>

                <div class="text-block" style="border-left: 5px solid var(--warning-color);">
                    <p style="margin-bottom: 10px;">⚠️ <strong>Trafiksäkerhet & Riskprognos</strong></p>
                    <div class="rad-ekonomi"><span>Sannolikhet incident (år):</span> <strong>${riskIncidentAr.toFixed(1)}%</strong></div>
                    <div class="rad-ekonomi"><span>Sannolikhet personskada (år):</span> <strong>${riskSkadaAr.toFixed(2)}%</strong></div>
                    <small class="beräknings-notis">Prognosen baseras på nationell olycksdata per personbilsmil.</small>
                </div>

                <div class="text-block" style="border-left: 5px solid var(--accent-color);">
                    <div style="margin-bottom:10px">
                        <label>⏱️ Vara framme:</label>
                        <input type="time" id="ankomst-tid" class="input-fält" value="08:00">
                    </div>
                    <div>
                        <label>🛡️ Säkerhetsmarginal:</label>
                        <input type="number" id="marginal" class="input-fält" value="10" style="width:50px"> min
                    </div>
                    <p style="margin-top: 12px;">🚗 Starta senast: <strong id="starta-senast" style="color: #e74c3c; font-size: 1.15rem;">-</strong></p>
                </div>

                <button class="maps-knapp" onclick="window.open('https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(csvFran)}&destination=${encodeURIComponent(csvTill)}&travelmode=driving')">🗺️ Starta GPS i Google Maps</button>
            `;

            initieraLogik(parseInt(tid));
        }

        function initieraLogik(körtidMinuter) {
            const tFält = document.getElementById('ankomst-tid');
            const mFält = document.getElementById('marginal');
            const resultat = document.getElementById('starta-senast');

            function beräkna() {
                const [h, m] = tFält.value.split(':').map(Number);
                let totalMin = h * 60 + m - körtidMinuter - parseInt(mFält.value || 0);
                if (totalMin < 0) totalMin += 1440;
                resultat.textContent = `kl. ${String(Math.floor(totalMin/60)).padStart(2,'0')}:${String(totalMin%60).padStart(2,'0')}`;
            }
            tFält.addEventListener('input', beräkna);
            mFält.addEventListener('input', beräkna);
            beräkna();
        }
    </script>
</body>
</html>
