<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gyllenstormś beräknade pendlingstid, avstånd och bränslekostnad för rutt med bil.">
    <meta name="robots" content="index, follow">
    <title id="sidtitel">Pendla - Tid och Avstånd</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #d4af37;
            --text-color: #333333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 8px;
            --intensiv-färg: #2c3e50;
            --success-color: #1abc9c;
            --warning-color: #e67e22;
            --ikon-bg: #edf2f7;
        }

        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #ecf0f1;
            --text-color: #e0e0e0;
            --text-light: #a0a0a0;
            --ikon-bg: #2d2d2d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 5px solid var(--accent-color);
        }

        .nav-rad { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        .tillbaka-länk {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .dela-knapp {
            background: none;
            border: 1px solid #e1e8ed;
            padding: 6px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        header { margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        body.dark-theme header { border-bottom-color: #333; }
        h1 { color: var(--primary-color); font-size: 1.5rem; }

        .kalkyl-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (min-width: 480px) {
            .kalkyl-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .kalkyl-kort {
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            color: white;
        }

        .kalkyl-kort.tid { background-color: #2c3e50; border-left: 5px solid var(--accent-color); }
        .kalkyl-kort.distans { background-color: #4a6572; }
        .kalkyl-kort.kostnad { background-color: var(--success-color); }

        .kalkyl-kort .etikett { display: block; font-size: 0.85rem; opacity: 0.9; }
        .kalkyl-kort .siffra { font-size: 1.6rem; font-weight: bold; }

        .text-block {
            background: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        body.dark-theme .text-block { background: #252525; border-color: #383838; }

        .rad-ekonomi { display: flex; justify-content: space-between; margin-bottom: 5px; }

        .beräknings-notis {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 15px;
            border-top: 1px solid #e1e8ed;
            padding-top: 10px;
            display: block;
        }

        .ankomst-input-fält {
            padding: 6px 10px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text-color);
            margin-left: 10px;
        }

        .maps-knapp {
            background: #2c3e50;
            color: white;
            padding: 14px;
            border-radius: var(--radius);
            font-weight: 600;
            width: 100%;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        /* --- STYLES FÖR TRAFIKSEKTIONEN --- */
        .trafik-analys { margin-top: 25px; }
        .intensitet-container { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .tids-block { display: flex; align-items: center; gap: 15px; }
        .klockslag { min-width: 90px; font-weight: 600; font-size: 0.85rem; }
        .stapel-ram { flex-grow: 1; height: 10px; background: var(--ikon-bg); border-radius: 10px; overflow: hidden; }
        .stapel-fyllning { height: 100%; border-radius: 10px; }
        .lugnt { width: 15%; background: #2ecc71; }
        .medel { width: 45%; background: #f1c40f; }
        .hög { width: 85%; background: #e67e22; }
        .extrem { width: 100%; background: #e74c3c; }
        .status-text { min-width: 80px; font-size: 0.75rem; text-align: right; color: var(--text-light); }

        .darkmode-btn {
            position: fixed; bottom: 20px; right: 20px; background: #2c3e50; color: white;
            border: none; padding: 12px; border-radius: 50%; cursor: pointer; width: 45px; height: 45px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-rad">
            <a href="index.html" class="tillbaka-länk">⬅️ Tillbaka till start</a>
            <button id="dela-btn" class="dela-knapp" style="display: none;">🔗 Dela rutt</button>
        </div>
        
        <header>
            <h1 id="rubrik">Laddar ruttinformation...</h1>
        </header>
        
        <div id="innehall">
            </div>
    </div>

    <button id="darkmode-btn" class="darkmode-btn" title="Växla nattläge">🌓</button>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fran = urlParams.get('fran');
        const till = urlParams.get('till');

        const KR_PER_KM = 1.304; 
        const ARBETSDAGAR_PER_AR = 225;
        const AVDRAG_PER_KM = 2.5; 
        const SJÄLVRISK = 11000; 
        const SKATT_EFFEKT = 0.30; 

        const RISK_INCIDENT = 0.00004; 
        const RISK_PERSONSKADA = 0.000003; 

        if (localStorage.getItem('mörkt_tema') === 'true') {
            document.body.classList.add('dark-theme');
        }
        document.getElementById('darkmode-btn').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('mörkt_tema', document.body.classList.contains('dark-theme'));
        });

        if (fran && till) {
            document.getElementById('sidtitel').innerText = `${fran} ➔ ${till} | Pendling`;
            document.getElementById('rubrik').innerText = `📍 ${fran} ➔ ${till}`;
            document.getElementById('dela-btn').style.display = 'flex';

            fetch('rutter.csv')
                .then(response => response.text())
                .then(data => {
                    let rader = data.split(/\r?\n/);
                    for (let i = 1; i < rader.length; i++) {
                        let kolumner = rader[i].split(',');
                        if (kolumner.length >= 5) {
                            let csvFran = kolumner[0].trim();
                            let csvTill = kolumner[1].trim();
                            if (csvFran.toLowerCase() === fran.toLowerCase() && csvTill.toLowerCase() === till.toLowerCase()) {
                                
                                let distansStr = kolumner[2].trim();
                                let tid = kolumner[3].trim();
                                let genereradText = kolumner[4].replace(/"/g, '').trim();

                                const km = parseFloat(distansStr.replace(/[^\d.]/g, ''));
                                const mil = km / 10;
                                const kostnadEnkel = km * KR_PER_KM;
                                const manadsKostnad = Math.round(kostnadEnkel * 2 * 22);
                                const arsKostnadBrutto = Math.round(kostnadEnkel * 2 * ARBETSDAGAR_PER_AR);
                                
                                const totaltAvdragsUnderlag = Math.round(km * 2 * ARBETSDAGAR_PER_AR * AVDRAG_PER_KM);
                                let skatteLättnad = totaltAvdragsUnderlag > SJÄLVRISK ? Math.round((totaltAvdragsUnderlag - SJÄLVRISK) * SKATT_EFFEKT) : 0;
                                const nettoArsKostnad = arsKostnadBrutto - skatteLättnad;

                                const distansArMil = (mil * 2) * ARBETSDAGAR_PER_AR;
                                const riskIncidentAr = (1 - Math.pow(1 - RISK_INCIDENT, distansArMil)) * 100;
                                const riskSkadaAr = (1 - Math.pow(1 - RISK_PERSONSKADA, distansArMil)) * 100;

                                // HÄR BYGGER VI HELA HTML-STRÄNGEN
                                document.getElementById('innehall').innerHTML = `
                                    <div class="kalkyl-grid">
                                        <div class="kalkyl-kort tid"><span class="etikett">⏱️ Körtid</span><span class="siffra">${tid} min</span></div>
                                        <div class="kalkyl-kort distans"><span class="etikett">📏 Distans</span><span class="siffra">${km} km</span></div>
                                        <div class="kalkyl-kort kostnad"><span class="etikett">⛽ Bränsle</span><span class="siffra">${Math.round(kostnadEnkel)} kr</span></div>
                                    </div>

                                    <div class="text-block"><p>📝 ${genereradText}</p></div>

                                    <div class="text-block" style="border-left: 5px solid var(--success-color);">
                                        <p>📊 <strong>Ekonomisk Kalkyl</strong></p>
                                        <div class="rad-ekonomi"><span>Månadskostnad:</span> <strong>${manadsKostnad.toLocaleString()} kr</strong></div>
                                        <div class="rad-ekonomi"><span>Skatteeffekt:</span> <strong style="color:green;">- ${skatteLättnad.toLocaleString()} kr/år</strong></div>
                                        <div class="rad-ekonomi"><span>Netto årskostnad:</span> <strong>${nettoArsKostnad.toLocaleString()} kr</strong></div>
                                        <small class="beräknings-notis">Copyright 2026 - Karl-Johan Gyllenstorm</small>
                                    </div>

                                    <div class="text-block" style="border-left: 5px solid var(--warning-color);">
                                        <p>⚠️ <strong>Riskprognos (År)</strong></p>
                                        <div class="rad-ekonomi"><span>Incidentrisk:</span> <strong>${riskIncidentAr.toFixed(1)}%</strong></div>
                                        <div class="rad-ekonomi"><span>Personskada:</span> <strong>${riskSkadaAr.toFixed(2)}%</strong></div>
                                    </div>

                                    <div class="text-block" style="border-left: 5px solid var(--accent-color);">
                                        <label>⏱️ Ankomsttid:</label>
                                        <input type="time" id="ankomst-tid" class="ankomst-input-fält" value="08:00">
                                        <p style="margin-top:10px;">🚗 Avresa senast: <strong id="starta-senast" style="color:#e74c3c;">-</strong></p>
                                    </div>

                                    <form action="https://www.google.com/maps/dir/?api=1&origin=${csvFran}&destination=${csvTill}&travelmode=driving" method="GET" target="_blank">
                                        <button type="submit" class="maps-knapp">🗺️ Starta GPS i Google Maps</button>
                                    </form>

                                    <div class="text-block trafik-analys">
                                        <p><strong>📊 Trafikens intensitet (Vardagar)</strong></p>
                                        <div class="intensitet-container">
                                            <div class="tids-block">
                                                <div class="klockslag">07:00 - 08:30</div>
                                                <div class="stapel-ram"><div class="stapel-fyllning extrem"></div></div>
                                                <div class="status-text">Maxtopp</div>
                                            </div>
                                            <div class="tids-block">
                                                <div class="klockslag">09:00 - 15:00</div>
                                                <div class="stapel-ram"><div class="stapel-fyllning lugnt"></div></div>
                                                <div class="status-text">Lugnt</div>
                                            </div>
                                            <div class="tids-block">
                                                <div class="klockslag">15:30 - 17:30</div>
                                                <div class="stapel-ram"><div class="stapel-fyllning extrem"></div></div>
                                                <div class="status-text">Maxtopp</div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                                
                                initieraAnkomstVäljare(parseInt(tid));
                                break;
                            }
                        }
                    }
                });
        }

        function initieraAnkomstVäljare(körtidMinuter) {
            const tidsFält = document.getElementById('ankomst-tid');
            const resultat = document.getElementById('starta-senast');
            function beräkna() {
                const [h, m] = tidsFält.value.split(':').map(Number);
                let total = (h * 60 + m - körtidMinuter + 1440) % 1440;
                resultat.textContent = `kl. ${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
            }
            tidsFält.addEventListener('input', beräkna);
            beräkna();
        }
    </script>
</body>
</html>
