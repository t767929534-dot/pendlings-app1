<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gyllenstormś beräknade pendlingstid, avstånd och bränslekostnad för rutt med bil.">
    <meta name="robots" content="index, follow">
    <title id="sidtitel">Pendla - Tid och Avstånd</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #d4af37;
            --text-color: #333333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 8px;
            --intensiv-färg: #2c3e50;
            --success-color: #1abc9c;
        }

        /* Dark Mode */
        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #ecf0f1;
            --text-color: #e0e0e0;
            --text-light: #a0a0a0;
            --intensiv-färg: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 5px solid var(--accent-color);
            transition: background-color 0.3s;
        }

        .nav-rad {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .tillbaka-länk {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .tillbaka-länk:hover {
            color: var(--primary-color);
        }

        .dela-knapp {
            background: none;
            border: 1px solid #e1e8ed;
            padding: 6px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        body.dark-theme .dela-knapp { border-color: #444; }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        body.dark-theme header { border-bottom-color: #333; }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            line-height: 1.3;
        }

        .kalkyl-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (min-width: 480px) {
            .kalkyl-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .kalkyl-kort {
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            color: white;
            box-shadow: var(--shadow);
        }

        .kalkyl-kort.tid { background-color: #2c3e50; border-left: 5px solid var(--accent-color); }
        .kalkyl-kort.distans { background-color: #4a6572; }
        .kalkyl-kort.kostnad { background-color: var(--success-color); }

        .kalkyl-kort .etikett {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .kalkyl-kort .siffra {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .text-block {
            background: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: var(--radius);
            padding: 20px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-color);
            margin-bottom: 20px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        body.dark-theme .text-block {
            background: #252525;
            border-color: #383838;
        }

        .rad-ekonomi {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .beräknings-notis {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 15px;
            border-top: 1px solid #e1e8ed;
            padding-top: 10px;
            display: block;
        }

        body.dark-theme .beräknings-notis { border-top-color: #333; }

        .ankomst-input-fält {
            padding: 6px 10px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
            margin-left: 10px;
        }

        .maps-knapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #2c3e50;
            color: white;
            padding: 14px;
            border-radius: var(--radius);
            font-weight: 600;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 1rem;
            font-family: inherit;
        }

        body.dark-theme .maps-knapp { background: #34495e; }

        .darkmode-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            font-size: 1.2rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-rad">
            <a href="index.html" class="tillbaka-länk">⬅️ Tillbaka till start</a>
            <button id="dela-btn" class="dela-knapp" style="display: none;">🔗 Dela rutt</button>
        </div>
        
        <header>
            <h1 id="rubrik">Laddar ruttinformation...</h1>
        </header>
        
        <div id="innehall">
            <div class="laddar">Söker efter objektiv data...</div>
        </div>
    </div>

    <button id="darkmode-btn" class="darkmode-btn" title="Växla nattläge">🌓</button>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fran = urlParams.get('fran');
        const till = urlParams.get('till');

        const KR_PER_KM = 1.304; 
        const ARBETSDAGAR_PER_AR = 225;
        const AVDRAG_PER_KM = 1.2; // 12 kr per mil
        const SJÄLVRISK = 11000;
        const SKATTEREDUKTION = 0.30; // 30% effekt av avdraget

        if (localStorage.getItem('mörkt_tema') === 'true') {
            document.body.classList.add('dark-theme');
        }
        document.getElementById('darkmode-btn').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('mörkt_tema', document.body.classList.contains('dark-theme'));
        });

        if (fran && till) {
            document.getElementById('sidtitel').innerText = `Pendla från ${fran} till ${till}`;
            document.getElementById('rubrik').innerText = `📍 ${fran} ➔ ${till}`;
            
            const delaBtn = document.getElementById('dela-btn');
            delaBtn.style.display = 'flex';

            fetch('rutter.csv')
                .then(response => response.text())
                .then(data => {
                    let rader = data.split(/\r?\n/);
                    let ruttHittad = false;

                    for (let i = 1; i < rader.length; i++) {
                        let kolumner = rader[i].split(',');
                        if (kolumner.length >= 5) {
                            let csvFran = kolumner[0].trim();
                            let csvTill = kolumner[1].trim();
                            let distansStr = kolumner[2].trim();
                            let tid = kolumner[3].trim();
                            let genereradText = kolumner[4].replace(/"/g, '').trim();

                            if (csvFran.toLowerCase() === fran.toLowerCase() && csvTill.toLowerCase() === till.toLowerCase()) {
                                
                                const km = parseFloat(distansStr.replace(/[^\d.]/g, ''));
                                
                                // Beräkningar
                                const kostnadEnkel = km * KR_PER_KM;
                                const manadsKostnad = Math.round(kostnadEnkel * 2 * 22);
                                const arsKostnadBrutto = Math.round(kostnadEnkel * 2 * ARBETSDAGAR_PER_AR);
                                
                                // Skatteavdrag
                                const totaltAvdrag = (km * 2 * ARBETSDAGAR_PER_AR * AVDRAG_PER_KM);
                                let skatteLättnad = 0;
                                if (totaltAvdrag > SJÄLVRISK) {
                                    skatteLättnad = Math.round((totaltAvdrag - SJÄLVRISK) * SKATTEREDUKTION);
                                }
                                const nettoArsKostnad = arsKostnadBrutto - skatteLättnad;

                                document.getElementById('innehall').innerHTML = `
                                    <div class="kalkyl-grid">
                                        <div class="kalkyl-kort tid">
                                            <span class="etikett">⏱️ Körtid</span>
                                            <span class="siffra">${tid} min</span>
                                        </div>
                                        <div class="kalkyl-kort distans">
                                            <span class="etikett">📏 Distans</span>
                                            <span class="siffra">${km} km</span>
                                        </div>
                                        <div class="kalkyl-kort kostnad">
                                            <span class="etikett">⛽ Bränsle</span>
                                            <span class="siffra">${Math.round(kostnadEnkel)} kr</span>
                                        </div>
                                    </div>

                                    <div class="text-block">
                                        <p>📝 ${genereradText}</p>
                                    </div>

                                    <div class="text-block" style="border-left: 5px solid var(--success-color);">
                                        <p style="margin-bottom: 10px;">📊 <strong>Ekonomisk Kalkyl</strong></p>
                                        <div class="rad-ekonomi"><span>Månadskostnad (22 dgr):</span> <strong>${manadsKostnad.toLocaleString('sv-SE')} kr</strong></div>
                                        <div class="rad-ekonomi"><span>Årskostnad (Brutto):</span> <strong>${arsKostnadBrutto.toLocaleString('sv-SE')} kr</strong></div>
                                        <hr style="margin: 10px 0; border: 0; border-top: 1px solid #eee;">
                                        <div class="rad-ekonomi" style="color: #27ae60;"><span>Uppskattat skatteavdrag:</span> <strong>- ${skatteLättnad.toLocaleString('sv-SE')} kr/år</strong></div>
                                        <div class="rad-ekonomi" style="font-weight: bold; margin-top: 5px;"><span>Netto årskostnad:</span> <span>${nettoArsKostnad.toLocaleString('sv-SE')} kr</span></div>
                                        
                                        <small class="beräknings-notis">* Skatteavdraget baseras på 12 kr/mil, 30% marginalskatt och 11 000 kr självrisk.</small>
                                    </div>

                                    <div class="text-block" style="border-left: 5px solid var(--accent-color);">
                                        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 5px;">
                                            <label style="font-weight: bold;">⏱️ När måste du vara framme?</label>
                                            <input type="time" id="ankomst-tid" class="ankomst-input-fält" value="08:00">
                                        </div>
                                        <p style="margin-top: 12px;">🚗 Du bör rulla hemifrån senast: <strong id="starta-senast" style="color: #e74c3c; font-size: 1.15rem;">-</strong></p>
                                    </div>

                                    <form action="https://www.google.com/maps/dir/" method="GET" target="_blank">
                                        <input type="hidden" name="api" value="1">
                                        <input type="hidden" name="origin" value="${csvFran}">
                                        <input type="hidden" name="destination" value="${csvTill}">
                                        <input type="hidden" name="travelmode" value="driving">
                                        <button type="submit" class="maps-knapp">🗺️ Starta GPS i Google Maps</button>
                                    </form>
                                `;
                                
                                initieraAnkomstVäljare(parseInt(tid));
                                ruttHittad = true;
                                break;
                            }
                        }
                    }
                });
        }

        function initieraAnkomstVäljare(körtidMinuter) {
            const tidsFält = document.getElementById('ankomst-tid');
            function beräknaAvgång() {
                const [timmar, minuter] = tidsFält.value.split(':').map(Number);
                let totalaMinuter = timmar * 60 + minuter - körtidMinuter;
                if (totalaMinuter < 0) totalaMinuter += 1440;
                const h = String(Math.floor(totalaMinuter / 60)).padStart(2, '0');
                const m = String(totalaMinuter % 60).padStart(2, '0');
                document.getElementById('starta-senast').textContent = `kl. ${h}:${m}`;
            }
            tidsFält.addEventListener('input', beräknaAvgång);
            beräknaAvgång();
        }
    </script>
</body>
</html>
