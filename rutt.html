<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Beräknad pendlingstid, avstånd och bränslekostnad för rutt med bil.">
    <title id="sidtitel">Pendla - Tid och Avstånd</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #d4af37;
            --text-color: #333333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 12px;
            --success-color: #1abc9c;
            --warning-color: #e67e22;
            --danger-color: #e74c3c;
            --co2-color: #27ae60;
        }

        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #ecf0f1;
            --text-color: #e0e0e0;
            --text-light: #a0a0a0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 6px solid var(--accent-color);
        }

        .nav-rad {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .tillbaka-länk {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
        }

        .dela-knapp {
            background: rgba(44, 62, 80, 0.05);
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 0.85rem;
        }

        header {
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 15px;
        }

        .kalkyl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .kalkyl-kort {
            padding: 15px;
            border-radius: var(--radius);
            text-align: center;
            color: white;
        }

        .kalkyl-kort.tid { background-color: var(--primary-color); }
        .kalkyl-kort.distans { background-color: #4a6572; }
        .kalkyl-kort.kostnad { background-color: var(--success-color); }

        .kalkyl-kort .etikett { display: block; font-size: 0.75rem; text-transform: uppercase; opacity: 0.9; }
        .kalkyl-kort .siffra { font-size: 1.4rem; font-weight: bold; }

        .text-block {
            background: rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        .rad-ekonomi {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        input[type="time"], input[type="number"] {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .maps-knapp {
            background: var(--primary-color);
            color: white;
            padding: 15px;
            border-radius: var(--radius);
            border: none;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.1s;
        }

        .maps-knapp:active { transform: scale(0.98); }

        .darkmode-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .co2-badge {
            display: inline-block;
            background: var(--co2-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-rad">
            <a href="index.html" class="tillbaka-länk">← Start</a>
            <button id="dela-btn" class="dela-knapp">📤 Dela</button>
        </div>
        
        <header>
            <h1 id="rubrik">Söker rutt...</h1>
        </header>
        
        <div id="innehall">
            </div>
    </div>

    <button id="darkmode-btn" class="darkmode-btn">🌓</button>

    <script>
        // Konstanter
        const CONFIG = {
            KR_PER_KM: 1.304,
            ARBETSDAGAR: 225,
            AVDRAG_KM: 2.5,
            SJÄLVRISK: 11000,
            SKATT_EFFEKT: 0.30,
            CO2_PER_KM: 120 // gram per km (snittbil)
        };

        const urlParams = new URLSearchParams(window.location.search);
        const fran = urlParams.get('fran');
        const till = urlParams.get('till');

        // Dark Mode Logic
        if (localStorage.getItem('mörkt_tema') === 'true') document.body.classList.add('dark-theme');
        document.getElementById('darkmode-btn').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('mörkt_tema', document.body.classList.contains('dark-theme'));
        });

        // Delningsfunktion
        document.getElementById('dela-btn').addEventListener('click', async () => {
            try {
                await navigator.share({
                    title: `Pendling ${fran} - ${till}`,
                    url: window.location.href
                });
            } catch (err) { console.log("Delning stöds inte"); }
        });

        if (fran && till) {
            document.getElementById('rubrik').innerText = `📍 ${fran} ➔ ${till}`;
            
            fetch('rutter.csv')
                .then(res => res.text())
                .then(data => {
                    const rader = data.split('\n').slice(1);
                    const match = rader.find(r => {
                        const cols = r.split(',');
                        return cols[0]?.trim().toLowerCase() === fran.toLowerCase() && 
                               cols[1]?.trim().toLowerCase() === till.toLowerCase();
                    });

                    if (match) {
                        renderData(match.split(','));
                    } else {
                        document.getElementById('innehall').innerHTML = "Rutten hittades inte i databasen.";
                    }
                });
        }

        function renderData(cols) {
            const km = parseFloat(cols[2]);
            const tidMin = parseInt(cols[3]);
            const infoText = cols[4].replace(/"/g, '');

            // Beräkningar
            const arsKostnadBrutto = km * 2 * CONFIG.KR_PER_KM * CONFIG.ARBETSDAGAR;
            const skatteLättnad = Math.max(0, (km * 2 * CONFIG.ARBETSDAGAR * CONFIG.AVDRAG_KM - CONFIG.SJÄLVRISK) * CONFIG.SKATT_EFFEKT);
            const co2Ar = (km * 2 * CONFIG.ARBETSDAGAR * CONFIG.CO2_PER_KM) / 1000;

            document.getElementById('innehall').innerHTML = `
                <div class="kalkyl-grid">
                    <div class="kalkyl-kort tid">
                        <span class="etikett">⏱️ Tid</span>
                        <span class="siffra">${tidMin} min</span>
                    </div>
                    <div class="kalkyl-kort distans">
                        <span class="etikett">📏 Distans</span>
                        <span class="siffra">${km} km</span>
                    </div>
                    <div class="kalkyl-kort kostnad">
                        <span class="etikett">⛽ Drivmedel</span>
                        <span class="siffra">${Math.round(km * CONFIG.KR_PER_KM)} kr</span>
                    </div>
                </div>

                <div class="text-block">
                    <p><strong>Beskrivning:</strong> ${infoText}</p>
                    <div class="co2-badge">🌱 CO2: ${Math.round(co2Ar)} kg/år</div>
                </div>

                <div class="text-block" style="border-left: 5px solid var(--success-color)">
                    <div class="rad-ekonomi"><span>Årskostnad Brutto:</span> <strong>${Math.round(arsKostnadBrutto).toLocaleString()} kr</strong></div>
                    <div class="rad-ekonomi" style="color:var(--co2-color)"><span>Skattereduktion:</span> <strong>- ${Math.round(skatteLättnad).toLocaleString()} kr</strong></div>
                    <hr>
                    <div class="rad-ekonomi" style="font-size:1.1rem; margin-top:5px"><span>Netto:</span> <strong>${Math.round(arsKostnadBrutto - skatteLättnad).toLocaleString()} kr/år</strong></div>
                </div>

                <div class="text-block" style="border-left: 5px solid var(--accent-color)">
                    <p><strong>Avgångskalkylator</strong></p>
                    <div class="input-group">
                        <label>Vara framme:</label>
                        <input type="time" id="ankomst-tid" value="08:00">
                    </div>
                    <div class="input-group">
                        <label>Marginal (min):</label>
                        <input type="number" id="marginal" value="10" min="0" max="60" style="width: 60px">
                    </div>
                    <p style="margin-top:15px">🚗 Kör hemifrån senast: <strong id="starta-senast" style="color:var(--danger-color)">--:--</strong></p>
                </div>

                <button class="maps-knapp" onclick="window.open('https://www.google.com/maps/dir/?api=1&origin=${fran}&destination=${till}&travelmode=driving')">🗺️ Öppna i Google Maps</button>
            `;

            setupTimer(tidMin);
        }

        function setupTimer(körtid) {
            const tidsInput = document.getElementById('ankomst-tid');
            const marginalInput = document.getElementById('marginal');
            const resultat = document.getElementById('starta-senast');

            function update() {
                const [h, m] = tidsInput.value.split(':').map(Number);
                let totalMin = h * 60 + m - körtid - parseInt(marginalInput.value || 0);
                if (totalMin < 0) totalMin += 1440;
                
                const utH = String(Math.floor(totalMin / 60)).padStart(2, '0');
                const utM = String(totalMin % 60).padStart(2, '0');
                resultat.innerText = `kl. ${utH}:${utM}`;
            }

            tidsInput.addEventListener('input', update);
            marginalInput.addEventListener('input', update);
            update();
        }
    </script>
</body>
</html>
