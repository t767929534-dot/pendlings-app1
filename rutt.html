<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="sidtitel">Pendla med Bil - Tid, Avstånd och Driftkostnad</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #d4af37;
            --text-color: #333333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 8px;
            --intensiv-färg: #2c3e50; /* Matchar den intensiva färgen från index-historiken */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 5px solid var(--accent-color);
        }

        .tillbaka-länk {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 25px;
            transition: color 0.2s;
        }

        .tillbaka-länk:hover {
            color: var(--primary-color);
        }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            line-height: 1.3;
        }

        /* Grid för kalkylblocken */
        .kalkyl-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (min-width: 480px) {
            .kalkyl-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Dynamiska färgblock för mätvärden */
        .kalkyl-kort {
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            color: white;
            box-shadow: var(--shadow);
        }

        .kalkyl-kort.tid {
            background-color: var(--intensiv-färg);
            border-left: 5px solid var(--accent-color);
        }

        .kalkyl-kort.distans {
            background-color: #4a6572;
        }

        .kalkyl-kort .etikett {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .kalkyl-kort .siffra {
            font-size: 1.8rem;
            font-weight: bold;
        }

        /* Textblocket för genererad text */
        .text-block {
            background: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: var(--radius);
            padding: 20px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-color);
            margin-bottom: 20px;
        }

        .text-block p {
            position: relative;
        }

        .laddar, .felmeddelande {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            padding: 30px 0;
        }
        
        .felmeddelande {
            color: #c0392b;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="tillbaka-länk">⬅️ Tillbaka till start</a>
        
        <header>
            <h1 id="rubrik">Laddar ruttinformation...</h1>
        </header>
        
        <div id="innehall">
            <div class="laddar">Söker efter objektiv data...</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fran = urlParams.get('fran');
        const till = urlParams.get('till');

        if (fran && till) {
            document.getElementById('sidtitel').innerText = `Pendla från ${fran} till ${till} - Tid, avstånd och kostnad`;
            document.getElementById('rubrik').innerText = `📍 ${fran} ➔ ${till}`;

            fetch('rutter.csv')
                .then(response => response.text())
                .then(data => {
                    let rader = data.split('\n');
                    let ruttHittad = false;

                    for (let i = 1; i < rader.length; i++) {
                        let kolumner = rader[i].split(',');
                        if (kolumner.length >= 5) {
                            let csvFran = kolumner[0].trim();
                            let csvTill = kolumner[1].trim();
                            let distans = kolumner[2].trim();
                            let tid = kolumner[3].trim();
                            let genereradText = kolumner[4].replace(/"/g, '').trim();

                            if (csvFran.toLowerCase() === fran.toLowerCase() && csvTill.toLowerCase() === till.toLowerCase()) {
                                // Renderar data i färgkodade block och textrutor
                                document.getElementById('innehall').innerHTML = `
                                    <div class="kalkyl-grid">
                                        <div class="kalkyl-kort tid">
                                            <span class="etikett">⏱️ Körtid</span>
                                            <span class="siffra">${tid} min</span>
                                        </div>
                                        <div class="kalkyl-kort distans">
                                            <span class="etikett">📏 Distans</span>
                                            <span class="siffra">${distans} km</span>
                                        </div>
                                    </div>
                                    <div class="text-block">
                                        <p>📝 ${genereradText}</p>
                                    </div>
                                `;
                                ruttHittad = true;
                                break;
                            }
                        }
                    }

                    if (!ruttHittad) {
                        document.getElementById('innehall').innerHTML = '<div class="felmeddelande">❌ Kunde inte hitta denna specifika rutt i databasen.</div>';
                    }
                })
                .catch(err => {
                    document.getElementById('innehall').innerHTML = '<div class="felmeddelande">❌ Ett fel uppstod vid laddning av databasen.</div>';
                });
        } else {
            document.getElementById('rubrik').innerText = "⚠️ Felaktig länk";
            document.getElementById('innehall').innerHTML = '<div class="felmeddelande">Vänligen gå tillbaka till startsidan och välj en rutt.</div>';
        }
    </script>
</body>
</html>
