<!DOCTYPE html>
<html lang="sv">
<head>
    <meta name="description" content="Beräkna pendlingstid, avstånd och bränslekostnad för din rutt.">
<meta name="robots" content="index, follow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="sidtitel">Pendla - Tid, Avstånd och Driftkostnad</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #d4af37;
            --text-color: #333333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 8px;
            --intensiv-färg: #2c3e50;
        }

        /* Dark Mode Färgvariabler */
        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #ecf0f1;
            --text-color: #e0e0e0;
            --text-light: #a0a0a0;
            --intensiv-färg: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 5px solid var(--accent-color);
            transition: background-color 0.3s;
        }

        .nav-rad {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .tillbaka-länk {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .tillbaka-länk:hover {
            color: var(--primary-color);
        }

        .dela-knapp {
            background: none;
            border: 1px solid #e1e8ed;
            padding: 6px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        body.dark-theme .dela-knapp {
            border-color: #444;
        }

        .dela-knapp:hover {
            background: rgba(0,0,0,0.02);
        }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        body.dark-theme header {
            border-bottom-color: #333;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            line-height: 1.3;
        }

        /* Grid för kalkylblocken */
        .kalkyl-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (min-width: 480px) {
            .kalkyl-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .kalkyl-kort {
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            color: white;
            box-shadow: var(--shadow);
        }

        .kalkyl-kort.tid {
            background-color: #2c3e50;
            border-left: 5px solid var(--accent-color);
        }

        .kalkyl-kort.distans {
            background-color: #4a6572;
        }

        .kalkyl-kort.kostnad {
            background-color: #1abc9c;
        }

        .kalkyl-kort .etikett {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .kalkyl-kort .siffra {
            font-size: 1.6rem;
            font-weight: bold;
        }

        /* Allmänna textblock */
        .text-block {
            background: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: var(--radius);
            padding: 20px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-color);
            margin-bottom: 20px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        body.dark-theme .text-block {
            background: #252525;
            border-color: #383838;
        }

        .beräknings-notis {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 15px;
            border-top: 1px solid #e1e8ed;
            padding-top: 10px;
            display: block;
        }

        body.dark-theme .beräknings-notis {
            border-top-color: #333;
        }

        /* Ankomstväljare design inputs */
        .ankomst-input-fält {
            padding: 6px 10px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
            margin-left: 10px;
            transition: border-color 0.2s;
        }

        .ankomst-input-fält:focus {
            border-color: var(--accent-color);
        }

        /* Google Maps-knapp */
        .maps-knapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: var(--radius);
            font-weight: 600;
            text-align: center;
            box-shadow: var(--shadow);
            transition: background 0.2s, transform 0.1s;
        }

        body.dark-theme .maps-knapp {
            background: #34495e;
        }

        .maps-knapp:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Flytande Dark Mode knapp */
        .darkmode-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            font-size: 1.2rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            transition: transform 0.2s;
        }

        .darkmode-btn:hover {
            transform: scale(1.05);
        }

        .laddar, .felmeddelande {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            padding: 30px 0;
        }
        
        .felmeddelande {
            color: #c0392b;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-rad">
            <a href="index.html" class="tillbaka-länk">⬅️ Tillbaka till start</a>
            <button id="dela-btn" class="dela-knapp" style="display: none;">🔗 Dela rutt</button>
        </div>
        
        <header>
            <h1 id="rubrik">Laddar Gyllenstormś ruttinformation...</h1>
        </header>
        
        <div id="innehall">
            <div class="laddar">Söker efter objektiv data...</div>
        </div>
    </div>

    <!-- Flytande Nattläge-Knapp -->
    <button id="darkmode-btn" class="darkmode-btn" title="Växla nattläge">🌓</button>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fran = urlParams.get('fran');
        const till = urlParams.get('till');

        // Bränslekostnad per km (1.15 kr/km = 11,50 kr/mil)
        const KR_PER_KM = 1.15; 

        // Hantera nattläges-status direkt vid laddning
        const dmBtn = document.getElementById('darkmode-btn');
        if (localStorage.getItem('mörkt_tema') === 'true') {
            document.body.classList.add('dark-theme');
        }
        dmBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('mörkt_tema', document.body.classList.contains('dark-theme'));
        });

        if (fran && till) {
            document.getElementById('sidtitel').innerText = `Pendla från ${fran} till ${till} - Tid, avstånd och kostnad`;
            document.getElementById('rubrik').innerText = `📍 ${fran} ➔ ${till}`;
            
            const delaBtn = document.getElementById('dela-btn');
            delaBtn.style.display = 'flex';
            delaBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(window.location.href)
                    .then(() => {
                        delaBtn.innerText = '✅ Länk kopierad!';
                        setTimeout(() => delaBtn.innerHTML = '🔗 Dela rutt', 2000);
                    });
            });

            fetch('rutter.csv')
                .then(response => response.text())
                .then(data => {
                    let rader = data.split('\n');
                    let ruttHittad = false;

                    for (let i = 1; i < rader.length; i++) {
                        let kolumner = rader[i].split(',');
                        if (kolumner.length >= 5) {
                            let csvFran = kolumner[0].trim();
                            let csvTill = kolumner[1].trim();
                            let distans = kolumner[2].trim();
                            let tid = kolumner[3].trim();
                            let genereradText = kolumner[4].replace(/"/g, '').trim();

                            if (csvFran.toLowerCase() === fran.toLowerCase() && csvTill.toLowerCase() === till.toLowerCase()) {
                                
                                const numeriskDistans = parseFloat(distans.replace(/[^\d.]/g, ''));
                                let kostnadText = "-";
                                let manadsKostnad = "-";

                                if (!isNaN(numeriskDistans)) {
                                    // Enkel resa bränsle
                                    kostnadText = Math.round(numeriskDistans * KR_PER_KM) + " kr";
                                    // 22 arbetsdagar tur & retur (multiplicerat med 2)
                                    manadsKostnad = Math.round((numeriskDistans * KR_PER_KM) * 2 * 22).toLocaleString('sv-SE');
                                }

                                const mapsUrl = `https://google.com{encodeURIComponent(fran)}&destination=${encodeURIComponent(till)}&travelmode=driving`;

                                // Alla block sparas och injiceras gemensamt så de inte försvinner
                                document.getElementById('innehall').innerHTML = `
                                    <div class="kalkyl-grid">
                                        <div class="kalkyl-kort tid">
                                            <span class="etikett">⏱️ Körtid</span>
                                            <span class="siffra">${tid} min</span>
                                        </div>
                                        <div class="kalkyl-kort distans">
                                            <span class="etikett">📏 Distans</span>
                                            <span class="siffra">${distans} km</span>
                                        </div>
                                        <div class="kalkyl-kort kostnad">
                                            <span class="etikett">⛽ Bränsle</span>
                                            <span class="siffra">${kostnadText}</span>
                                        </div>
                                    </div>

                                    <!-- Block 1: Beskrivning -->
                                    <div class="text-block">
                                        <p>📝 ${genereradText}</p>
                                        <small class="beräknings-notis">* Kostnaden avser uppskattad ren bränslekostnad baserad på genomsnittlig förbrukning (11,50 kr/mil).</small>
                                    </div>

                                    <!-- Block 2: Månadskalkylator (Nyhet) -->
                                    <div class="text-block" style="border-left: 5px solid #1abc9c;">
                                        <p>📊 <strong>Månadskostnad:</strong> <span style="font-weight: bold; color: #1abc9c; font-size:1.15rem;">${manadsKostnad} kr</span> / månad</p>
                                        <p style="font-size: 0.8rem; color: var(--text-light); margin-top: 3px;">Beräknat på full pendling tur och retur i 22 arbetsdagar.</p>
                                    </div>

                                    <!-- Block 3: Ankomstväljare (Nyhet) -->
                                    <div class="text-block" style="border-left: 5px solid var(--accent-color);">
                                        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 5px;">
                                            <label style="font-weight: bold;">⏱️ När måste du vara framme?</label>
                                            <input type="time" id="ankomst-tid" class="ankomst-input-fält" value="08:00">
                                        </div>
                                        <p style="margin-top: 12px; font-size: 1.05rem;">
                                            🚗 Du bör rulla hemifrån senast: <strong id="starta-senast" style="color: #e74c3c; font-size: 1.15rem;">-</strong>
                                        </p>
                                    </div>

                                    <a href="${mapsUrl}" target="_blank" class="maps-knapp">🗺️ Starta GPS i Google Maps</a>
                                `;
                                
                                // Aktivera beräkningslogiken för ankomstväljaren efter att HTML-elementen har skapats
                                initieraAnkomstVäljare(parseInt(tid));
                                ruttHittad = true;
                                break;
                            }
                        }
                    }

                    if (!ruttHittad) {
                        document.getElementById('innehall').innerHTML = '<div class="felmeddelande">❌ Kunde inte hitta denna specifika rutt i databasen.</div>';
                    }
                })
                .catch(err => {
                    document.getElementById('innehall').innerHTML = '<div class="felmeddelande">❌ Ett fel uppstod vid laddning av databasen.</div>';
                });
        } else {
            document.getElementById('rubrik').innerText = "⚠️ Felaktig länk";
            document.getElementById('innehall').innerHTML = '<div class="felmeddelande">Vänligen gå tillbaka till startsidan och välj en rutt.</div>';
        }

        // Hjälpfunktion för att räkna bakåt i realtid
        function initieraAnkomstVäljare(körtidMinuter) {
            const tidsFält = document.getElementById('ankomst-tid');
            if(!tidsFält) return;

            function beräknaAvgång() {
                const [timmar, minuter] = tidsFält.value.split(':').map(Number);
                let totalaMinuter = timmar * 60 + minuter - körtidMinuter;
                
                if (totalaMinuter < 0) {
                    totalaMinuter += 1440; // Om dygnet vänder bakåt
                }
                
                const avgångsTimme = String(Math.floor(totalaMinuter / 60)).padStart(2, '0');
                const avgångsMinut = String(totalaMinuter % 60).padStart(2, '0');
                
                document.getElementById('starta-senast').textContent = `kl. ${avgångsTimme}:${avgångsMinut}`;
            }

            tidsFält.addEventListener('input', beräknaAvgång);
            beräknaAvgång(); // Kör kalkylen en gång direkt vid laddning
        }
    </script>
</body>
</html>
