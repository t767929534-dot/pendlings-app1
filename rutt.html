<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gyllenstormś beräknade pendlingstid, avstånd och bränslekostnad för rutt med bil.">
    <meta name="robots" content="index, follow">
    <title id="sidtitel">Pendla - Tid och Avstånd</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #d4af37;
            --text-color: #333333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 8px;
            --intensiv-färg: #2c3e50;
            --success-color: #1abc9c;
            --warning-color: #e67e22; /* Ny färg för risksektionen */
            --ikon-bg: #edf2f7;
        }

        /* Dark Mode */
        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #ecf0f1;
            --text-color: #e0e0e0;
            --text-light: #a0a0a0;
            --intensiv-färg: #2c3e50;
            --ikon-bg: #2d2d2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 5px solid var(--accent-color);
            transition: background-color 0.3s;
        }

        .nav-rad {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .tillbaka-länk {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .tillbaka-länk:hover {
            color: var(--primary-color);
        }

        .dela-knapp {
            background: none;
            border: 1px solid #e1e8ed;
            padding: 6px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        body.dark-theme .dela-knapp { border-color: #444; }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        body.dark-theme header { border-bottom-color: #333; }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            line-height: 1.3;
        }

        .kalkyl-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (min-width: 480px) {
            .kalkyl-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .kalkyl-kort {
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            color: white;
            box-shadow: var(--shadow);
        }

        .kalkyl-kort.tid { background-color: #2c3e50; border-left: 5px solid var(--accent-color); }
        .kalkyl-kort.distans { background-color: #4a6572; }
        .kalkyl-kort.kostnad { background-color: var(--success-color); }

        .kalkyl-kort .etikett {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .kalkyl-kort .siffra {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .text-block {
            background: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: var(--radius);
            padding: 20px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-color);
            margin-bottom: 20px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        body.dark-theme .text-block {
            background: #252525;
            border-color: #383838;
        }

        .rad-ekonomi {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .beräknings-notis {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 15px;
            border-top: 1px solid #e1e8ed;
            padding-top: 10px;
            display: block;
        }

        body.dark-theme .beräknings-notis { border-top-color: #333; }

        .ankomst-input-fält {
            padding: 6px 10px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
            margin-left: 10px;
        }

        .maps-knapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #2c3e50;
            color: white;
            padding: 14px;
            border-radius: var(--radius);
            font-weight: 600;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 1rem;
            font-family: inherit;
        }

        body.dark-theme .maps-knapp { background: #34495e; }

        .darkmode-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            font-size: 1.2rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
        }

        /* --- STYLES FÖR DEN NYA TRAFIKSEKTIONEN --- */
        .trafik-analys {
            margin-top: 25px;
            padding: 25px;
            background: #fafbfc;
            border-radius: var(--radius);
            border: 1px solid #e1e8ed;
        }

        body.dark-theme .trafik-analys {
            background: #252525;
            border-color: #383838;
        }

        .trafik-analys h3 {
            font-size: 1.1rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .intensitet-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tids-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .klockslag {
            min-width: 90px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .stapel-ram {
            flex-grow: 1;
            height: 12px;
            background: var(--ikon-bg);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .stapel-fyllning {
            height: 100%;
            border-radius: 10px;
        }

        .lugnt { width: 15%; background: #2ecc71; }
        .medel { width: 45%; background: #f1c40f; }
        .hög { width: 85%; background: #e67e22; }
        .extrem { width: 100%; background: #e74c3c; box-shadow: 0 0 10px rgba(231, 76, 60, 0.4); }

        .status-text {
            min-width: 80px;
            font-size: 0.8rem;
            text-align: right;
            font-weight: 500;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-rad">
            <a href="index.html" class="tillbaka-länk">⬅️ Tillbaka till start</a>
            <button id="dela-btn" class="dela-knapp" style="display: none;">🔗 Dela rutt</button>
        </div>
        
        <header>
            <h1 id="rubrik">Laddar ruttinformation...</h1>
        </header>
        
        <div id="innehall">
            <div class="laddar">Söker efter objektiv data...</div>
        </div>

        <section class="trafik-analys">
            <h3>📊 Trafikens intensitet (Vardagar)</h3>
            <div class="intensitet-container">
                <div class="tids-block">
                    <div class="klockslag">06:00 - 07:00</div>
                    <div class="stapel-ram"><div class="stapel-fyllning medel"></div></div>
                    <div class="status-text">Ökande</div>
                </div>
                <div class="tids-block">
                    <div class="klockslag">07:00 - 08:30</div>
                    <div class="stapel-ram"><div class="stapel-fyllning extrem"></div></div>
                    <div class="status-text">Maxtopp</div>
                </div>
                <div class="tids-block">
                    <div class="klockslag">09:00 - 15:00</div>
                    <div class="stapel-ram"><div class="stapel-fyllning lugnt"></div></div>
                    <div class="status-text">Gles trafik</div>
                </div>
                <div class="tids-block">
                    <div class="klockslag">15:30 - 17:30</div>
                    <div class="stapel-ram"><div class="stapel-fyllning extrem"></div></div>
                    <div class="status-text">Maxtopp</div>
                </div>
                <div class="tids-block">
                    <div class="klockslag">18:00 - 20:00</div>
                    <div class="stapel-ram"><div class="stapel-fyllning hög"></div></div>
                    <div class="status-text">Minskande</div>
                </div>
            </div>
            <small class="beräknings-notis" style="border:none; margin-top:15px; font-style: italic;">
                * Genomsnittlig mätdata för pendlingsstråk.
            </small>
        </section>
    </div>

    <button id="darkmode-btn" class="darkmode-btn" title="Växla nattläge">🌓</button>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fran = urlParams.get('fran');
        const till = urlParams.get('till');

        // INSTÄLLNINGAR FÖR BERÄKNING
        const KR_PER_KM = 1.304; 
        const ARBETSDAGAR_PER_AR = 225;
        const AVDRAG_PER_KM = 2.5; 
        const SJÄLVRISK = 11000; 
        const SKATT_EFFEKT = 0.30; 

        // RISKFAKTORER (Sannolikhet per mil)
        const RISK_INCIDENT = 0.00004; // Plåtskada/Vilt
        const RISK_PERSONSKADA = 0.000003; // Lindrig personskada

        if (localStorage.getItem('mörkt_tema') === 'true') {
            document.body.classList.add('dark-theme');
        }
        document.getElementById('darkmode-btn').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('mörkt_tema', document.body.classList.contains('dark-theme'));
        });

        if (fran && till) {
            document.getElementById('sidtitel').innerText = ` ${fran} ➔ ${till} | Pendlingstid & Kostnad | Karl-Johan Gyllenstorm `;
            document.getElementById('rubrik').innerText = `📍 ${fran} ➔ ${till}`;
            
            const delaBtn = document.getElementById('dela-btn');
            delaBtn.style.display = 'flex';

            fetch('rutter.csv')
                .then(response => response.text())
                .then(data => {
                    let rader = data.split(/\r?\n/);
                    let ruttHittad = false;

                    for (let i = 1; i < rader.length; i++) {
                        let kolumner = rader[i].split(',');
                        if (kolumner.length >= 5) {
                            let csvFran = kolumner[0].trim();
                            let csvTill = kolumner[1].trim();
                            let distansStr = kolumner[2].trim();
                            let tid = kolumner[3].trim();
                            let genereradText = kolumner[4].replace(/"/g, '').trim();

                            if (csvFran.toLowerCase() === fran.toLowerCase() && csvTill.toLowerCase() === till.toLowerCase()) {
                                
                                const km = parseFloat(distansStr.replace(/[^\d.]/g, ''));
                                const mil = km / 10;
                                
                                // Grundberäkningar kostnad
                                const dagligDistansKm = km * 2;
                                const dagligDistansMil = mil * 2;
                                const kostnadEnkel = km * KR_PER_KM;
                                const manadsKostnad = Math.round(kostnadEnkel * 2 * 22);
                                const arsKostnadBrutto = Math.round(kostnadEnkel * 2 * ARBETSDAGAR_PER_AR);
                                
                                // Skatteavdrag
                                const totaltAvdragsUnderlag = Math.round(dagligDistansKm * ARBETSDAGAR_PER_AR * AVDRAG_PER_KM);
                                let skatteLättnad = 0;
                                if (totaltAvdragsUnderlag > SJÄLVRISK) {
                                    skatteLättnad = Math.round((totaltAvdragsUnderlag - SJÄLVRISK) * SKATT_EFFEKT);
                                }
                                const nettoArsKostnad = arsKostnadBrutto - skatteLättnad;

                                // RISKBERÄKNINGAR (
