<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gyllenstormś beräknade pendlingstid, avstånd och bränslekostnad för rutt med bil.">
    <meta name="robots" content="index, follow">
    <title id="sidtitel">Pendla - Tid och Avstånd</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #d4af37;
            --text-color: #333333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 8px;
            --intensiv-färg: #2c3e50;
            --success-color: #1abc9c;
            --warning-color: #e67e22;
            --danger-color: #e74c3c;
        }

        /* Dark Mode */
        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #ecf0f1;
            --text-color: #e0e0e0;
            --text-light: #a0a0a0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 5px solid var(--accent-color);
        }

        .nav-rad { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        .tillbaka-länk {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .kalkyl-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (min-width: 480px) {
            .kalkyl-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .kalkyl-kort {
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            color: white;
            box-shadow: var(--shadow);
        }

        .kalkyl-kort.tid { background-color: #2c3e50; border-left: 5px solid var(--accent-color); }
        .kalkyl-kort.distans { background-color: #4a6572; }
        .kalkyl-kort.kostnad { background-color: var(--success-color); }

        .kalkyl-kort .etikett { display: block; font-size: 0.85rem; text-transform: uppercase; opacity: 0.9; }
        .kalkyl-kort .siffra { font-size: 1.6rem; font-weight: bold; }

        .text-block {
            background: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        body.dark-theme .text-block { background: #252525; border-color: #383838; }

        .rad-ekonomi { display: flex; justify-content: space-between; margin-bottom: 5px; }

        .ankomst-input-fält {
            padding: 6px 10px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text-color);
            margin-left: 10px;
        }

        .sol-varning {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            display: none; /* Visas via JS */
            align-items: center;
            gap: 10px;
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ffcc80;
        }

        .maps-knapp {
            background: #2c3e50;
            color: white;
            padding: 14px;
            border-radius: var(--radius);
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
        }

        .darkmode-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            width: 45px;
            height: 45px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-rad">
            <a href="index.html" class="tillbaka-länk">⬅️ Tillbaka</a>
            <button id="dela-btn" class="dela-knapp" style="display: none; background:none; border:none; cursor:pointer;">🔗 Dela</button>
        </div>
        
        <header>
            <h1 id="rubrik" style="margin-bottom: 20px;">Laddar rutt...</h1>
        </header>
        
        <div id="innehall"></div>
    </div>

    <button id="darkmode-btn" class="darkmode-btn">🌓</button>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fran = urlParams.get('fran');
        const till = urlParams.get('till');

        // Beräkningskonstanter
        const KR_PER_KM = 1.304;
        const ARBETSDAGAR_PER_AR = 225;
        const AVDRAG_PER_KM = 2.5;
        const SJÄLVRISK = 11000;
        const SKATT_EFFEKT = 0.30;

        // Solposition (Approximation för Mellansverige)
        function getSunElevation(hours, minutes) {
            const now = new Date();
            const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
            const timeInHours = hours + minutes / 60;
            
            // Mycket förenklad sinusmodell för solhöjd
            // Justerad för att toppa vid kl 12:00 och ta hänsyn till årstid
            const declination = 23.45 * Math.sin((360 / 365) * (dayOfYear - 81) * (Math.PI / 180));
            const latitude = 59.3; // Stockholm approx
            const hourAngle = (timeInHours - 12) * 15;
            
            const elevation = Math.asin(
                Math.sin(latitude * Math.PI / 180) * Math.sin(declination * Math.PI / 180) +
                Math.cos(latitude * Math.PI / 180) * Math.cos(declination * Math.PI / 180) * Math.cos(hourAngle * Math.PI / 180)
            );
            
            return elevation * (180 / Math.PI);
        }

        if (fran && till) {
            fetch('rutter.csv').then(r => r.text()).then(data => {
                let rader = data.split(/\r?\n/);
                for (let i = 1; i < rader.length; i++) {
                    let kol = rader[i].split(',');
                    if (kol.length >= 5 && kol[0].trim().toLowerCase() === fran.toLowerCase()) {
                        visaRutt(kol);
                        break;
                    }
                }
            });
        }

        function visaRutt(kol) {
            const km = parseFloat(kol[2].replace(/[^\d.]/g, ''));
            const tid = parseInt(kol[3]);
            const genereradText = kol[4].replace(/"/g, '');

            document.getElementById('rubrik').innerText = `📍 ${kol[0]} ➔ ${kol[1]}`;
            
            document.getElementById('innehall').innerHTML = `
                <div class="kalkyl-grid">
                    <div class="kalkyl-kort tid"><span class="etikett">⏱️ Körtid</span><span class="siffra">${tid} min</span></div>
                    <div class="kalkyl-kort distans"><span class="etikett">📏 Distans</span><span class="siffra">${km} km</span></div>
                    <div class="kalkyl-kort kostnad"><span class="etikett">⛽ Bränsle</span><span class="siffra">${Math.round(km * KR_PER_KM)} kr</span></div>
                </div>

                <div class="text-block" style="border-left: 5px solid var(--accent-color);">
                    <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 5px;">
                        <label style="font-weight: bold;">⏱️ Önskad ankomst:</label>
                        <input type="time" id="ankomst-tid" class="ankomst-input-fält" value="08:00">
                    </div>
                    <p style="margin-top: 12px;">🚗 Starta senast: <strong id="starta-senast" style="color: var(--danger-color); font-size: 1.15rem;">-</strong></p>
                    
                    <div id="sol-varning" class="sol-varning">
                        ☀️ <span><strong>Risk för solbländning!</strong> Solen står lågt vid avresa. Använd solskydd.</span>
                    </div>
                </div>

                <div class="text-block">📝 ${genereradText}</div>

                <button onclick="window.open('https://www.google.com/maps/dir/?api=1&origin=${kol[0]}&destination=${kol[1]}')" class="maps-knapp">🗺️ Starta Google Maps</button>
            `;

            initieraLogik(tid);
        }

        function initieraLogik(körtid) {
            const tidsFält = document.getElementById('ankomst-tid');
            const varning = document.getElementById('sol-varning');
            
            function uppdatera() {
                const [h, m] = tidsFält.value.split(':').map(Number);
                let totalMin = h * 60 + m - körtid;
                if (totalMin < 0) totalMin += 1440;
                
                const startH = Math.floor(totalMin / 60);
                const startM = totalMin % 60;
                
                document.getElementById('starta-senast').textContent = `kl. ${String(startH).padStart(2,'0')}:${String(startM).padStart(2,'0')}`;

                // Kolla solbländning (Elevation mellan 2 och 12 grader räknas som kritisk)
                const elevation = getSunElevation(startH, startM);
                if (elevation > 2 && elevation < 12) {
                    varning.style.display = 'flex';
                } else {
                    varning.style.display = 'none';
                }
            }

            tidsFält.addEventListener('input', uppdatera);
            uppdatera();
        }

        // Darkmode
        document.getElementById('darkmode-btn').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
        });
    </script>
</body>
</html>
