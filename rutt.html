<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gyllenstormś beräknade pendlingstid, avstånd och bränslekostnad för rutt med bil.">
    <meta name="robots" content="index, follow">
    <title id="sidtitel">Pendla - Tid och Avstånd</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #d4af37;
            --text-color: #333333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 8px;
            --success-color: #1abc9c;
            --warning-color: #e67e22;
            --danger-color: #e74c3c;
        }

        body.dark-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #ecf0f1;
            --text-color: #e0e0e0;
            --text-light: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 5px solid var(--accent-color);
            transition: background-color 0.3s;
        }

        .nav-rad {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .tillbaka-länk {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .tillbaka-länk:hover { color: var(--primary-color); }

        .dela-knapp {
            background: none;
            border: 1px solid #e1e8ed;
            padding: 6px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        body.dark-theme .dela-knapp { border-color: #444; }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        body.dark-theme header { border-bottom-color: #333; }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            line-height: 1.3;
        }

        .kalkyl-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (min-width: 480px) {
            .kalkyl-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .kalkyl-kort {
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            color: white;
            box-shadow: var(--shadow);
        }

        .kalkyl-kort.tid { background-color: #2c3e50; border-left: 5px solid var(--accent-color); }
        .kalkyl-kort.distans { background-color: #4a6572; }
        .kalkyl-kort.kostnad { background-color: var(--success-color); }

        .kalkyl-kort .etikett {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .kalkyl-kort .siffra {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .text-block {
            background: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: var(--radius);
            padding: 20px;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        body.dark-theme .text-block {
            background: #252525;
            border-color: #383838;
        }

        .rad-ekonomi {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .beräknings-notis {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 15px;
            border-top: 1px solid #e1e8ed;
            padding-top: 10px;
            display: block;
        }

        body.dark-theme .beräknings-notis { border-top-color: #333; }

        .ankomst-input-fält {
            padding: 6px 10px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
            margin-left: 10px;
        }

        .maps-knapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #2c3e50;
            color: white;
            padding: 14px;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 1rem;
        }

        .darkmode-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-rad">
            <a href="index.html" class="tillbaka-länk">⬅️ Tillbaka till start</a>
            <button id="dela-btn" class="dela-knapp" style="display: none;">🔗 Dela rutt</button>
        </div>
        
        <header>
            <h1 id="rubrik">Hämtar ruttdata...</h1>
        </header>
        
        <div id="innehall">
            <p>Läser in databasen från Cloudflare Pages...</p>
        </div>
    </div>

    <button id="darkmode-btn" class="darkmode-btn" title="Växla nattläge">🌓</button>

    <script>
        // Globala variabler för URL-parametrar
        const urlParams = new URLSearchParams(window.location.search);
        const fran = urlParams.get('fran') || "";
        const till = urlParams.get('till') || "";

        // KONSTANTER FÖR BERÄKNING
        const KR_PER_KM = 1.304; 
        const ARBETSDAGAR_PER_AR = 225;
        const AVDRAG_PER_KM = 2.5; 
        const SJÄLVRISK = 11000; 
        const SKATT_EFFEKT = 0.30; 

        const RISK_INCIDENT = 0.00004; 
        const RISK_PERSONSKADA = 0.000003; 

        // Hantera mörkt läge direkt vid start
        if (localStorage.getItem('mörkt_tema') === 'true') {
            document.body.classList.add('dark-theme');
        }
        document.getElementById('darkmode-btn').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('mörkt_tema', document.body.classList.contains('dark-theme'));
        });

        // Kör hela logiken först när DOM-strukturen är helt redo
        document.addEventListener("DOMContentLoaded", () => {
            if (!fran || !till) {
                document.getElementById('rubrik').innerText = "⚠️ Ingen rutt vald";
                document.getElementById('innehall').innerHTML = "<p>Gå tillbaka till startsidan och välj startpunkt samt destination.</p>";
                return;
            }

            document.getElementById('sidtitel').innerText = `${fran} ➔ ${till} | Pendlingstid & Kostnad`;
            document.getElementById('rubrik').innerText = `📍 ${fran} ➔ ${till}`;

            // Läser in filen relativt till rotmappen på Cloudflare Pages
            fetch('./rutter.csv')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Kunde inte hitta rutter.csv (Status: ${response.status}). Kontrollera att filen ligger på GitHub-rotmappen.`);
                    }
                    return response.text();
                })
                .then(data => {
                    let rader = data.split(/\r?\n/);
                    let ruttHittad = false;

                    for (let i = 1; i < rader.length; i++) {
                        let kolumner = rader[i].split(',');
                        if (kolumner.length >= 5) {
                            let csvFran = kolumner[0].trim();
                            let csvTill = kolumner[1].trim();
                            let distansStr = kolumner[2].trim();
                            let tid = kolumner[3].trim();
                            let genereradText = kolumner[4].replace(/"/g, '').trim();

                            if (csvFran.toLowerCase() === fran.toLowerCase() && csvTill.toLowerCase() === till.toLowerCase()) {
                                ruttHittad = true;
                                byggGränssnitt(kmFrånStr(distansStr), tid, genereradText, csvFran, csvTill);
                                break;
                            }
                        }
                    }

                    if (!ruttHittad) {
                        document.getElementById('innehall').innerHTML = `<p>Rutten mellan <strong>"${fran}"</strong> och <strong>"${till}"</strong> matchar inte någon rad i din rutter.csv.</p>`;
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('rubrik').innerText = "❌ Fel vid inläsning";
                    document.getElementById('innehall').innerHTML = `
                        <div style="background: rgba(231, 76, 60, 0.1); border-left: 4px solid var(--danger-color); padding: 15px; border-radius: 6px;">
                            <p style="font-weight: bold; color: var(--danger-color);">Ett nätverks- eller byggfel uppstod på Cloudflare Pages:</p>
                            <p style="font-family: monospace; font-size: 0.9rem; margin-top: 5px;">${err.message}</p>
                        </div>
                    `;
                });
        });

        // Hjälpfunktion för att rensa strängar till rena siffror
        function kmFrånStr(str) {
            return parseFloat(str.replace(/[^\d.]/g, '')) || 0;
        }

        // Funktion som bygger upp DOM dynamiskt när datan har validerats
        function byggGränssnitt(km, tid, text, csvFran, csvTill) {
            document.getElementById('dela-btn').style.display = 'flex';
            
            const mil = km / 10;
            const dagligDistansKm = km * 2;
            const dagligDistansMil = mil * 2;
            const kostnadEnkel =
